<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprendeMais - Login e Cadastro</title>
    
    <!-- Fonte externa (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Link para o CSS -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="header-login">
        <h1>AprendeMais</h1>
        <p>Conectando você a oportunidades de aprendizado e desenvolvimento!</p>
    </header>

    <main class="container">
        <!-- SEÇÃO DE CADASTRO (Mínimo de 5 campos) -->
        <section class="form-section" id="cadastro-section">
            <h2>Crie sua Conta</h2>
            <!-- Direciona o usuário para a parte de login na mesma página -->
            <form action="#login-section" method="get">
                <div class="input-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required>
                </div>
                <div class="input-group">
                    <label for="email-cad">E-mail:</label>
                    <input type="email" id="email-cad" name="email-cad" placeholder="joao@email.com" required>
                </div>
                <div class="input-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>
                <!-- Campo adaptado para o tema de Educação -->
                <div class="input-group">
                    <label for="escolaridade">Grau de Escolaridade:</label>
                    <input type="text" id="escolaridade" name="escolaridade" placeholder="Ex: Ensino Médio Incompleto" required>
                </div>
                <div class="input-group">
                    <label for="senha-cad">Crie uma Senha:</label>
                    <input type="password" id="senha-cad" name="senha-cad" required>
                </div>
                <!-- Botão que direciona para a seção de login -->
                <button type="submit" class="btn-primary">Cadastrar e ir para Login</button>
            </form>
        </section>

        <!-- SEÇÃO DE LOGIN -->
        <section class="form-section" id="login-section">
            <h2>Acesse sua Conta</h2>
            <!-- Direciona para a página principal solicitada no escopo -->
            <form action="index.html" method="get">
                <div class="input-group">
                    <label for="email-login">E-mail:</label>
                    <input type="email" id="email-login" name="email-login" placeholder="Seu e-mail cadastrado" required>
                </div>
                <div class="input-group">
                    <label for="senha-login">Senha:</label>
                    <input type="password" id="senha-login" name="senha-login" placeholder="Sua senha de acesso" required>
                </div>
                <button type="submit" class="btn-success">Entrar na Plataforma</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projeto AprendeMais. Focado no ODS 4 - Educação de Qualidade.</p>
    </footer>
</body>
</html>
